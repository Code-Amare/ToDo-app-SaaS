<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Todo{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7; padding: 32px 16px;">
    <tr>
      <td align="center">

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background-color:#ffffff; border-radius:8px; overflow:hidden;">

          <tr>
            <td style="background-color:#111827; padding: 24px 32px;">
              <span style="color:#ffffff; font-size:18px; font-weight:600;">Todo</span>
            </td>
          </tr>

          <tr>
            <td style="padding: 32px; color:#374151; font-size:15px; line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <tr>
            <td style="padding: 20px 32px; background-color:#f9fafb; border-top:1px solid #e5e7eb;">
              <p style="margin:0; color:#9ca3af; font-size:12px; line-height:1.5;">
                {% block footer %}
                You're receiving this email because you have an account with Todo. If you didn't expect this email, you can safely ignore it.
                {% endblock %}
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
